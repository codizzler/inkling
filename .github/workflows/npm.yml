name: npm

# Pushing a version tag publishes the Node addon and the WebAssembly package to
# npm. One-time setup: add a granular access token as the repo secret NPM_TOKEN
# (npmjs.com -> Access Tokens -> Generate New Token). Legacy "classic" tokens,
# including the Automation type older guides name, were removed in November
# 2025, so two settings on the granular token do that job instead:
#
#   * Packages and scopes: Read and write on *All packages*. Scoping it to a
#     selected list cannot create a package that does not exist yet, and npm
#     reports that as a 404 on PUT rather than a permission error.
#   * Bypass 2FA: enabled. It defaults to off, and without it every publish
#     fails with EOTP asking for a one-time password no runner can supply.
#
# npm's own recommendation for CI is trusted publishing (OIDC), which needs no
# token at all; `id-token: write` is already granted below for it. It requires
# configuring a publisher per package on npmjs.com, so it is worth moving to
# once the platform packages exist.
#
# It can also be run manually from the Actions tab. That builds every platform
# binary and the wasm package but publishes nothing, so a new target can be
# proven before a version number is spent on it: registry versions are
# immutable, and a build that fails after its siblings have shipped leaves the
# packages out of step.
#
# The Node job follows the standard napi-rs flow (one prebuilt binary per
# platform, tied together by optionalDependencies). The WASM job is a single,
# platform-independent package.
#
# Platform coverage matters more here than anywhere else: npm install has no
# source fallback, so a missing triple is a hard install failure for everyone on
# it. Alpine containers and arm64 Linux are both common enough to be table
# stakes, and both were missing before.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm using the version in the manifests (recovery for a half-finished release)"
        type: boolean
        default: false

# A tag publishes. A manual run only builds, unless it is explicitly asked to
# publish, which is the escape hatch for finishing a release that landed the
# main package without its platform packages.
env:
  PUBLISH: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'true' || 'false' }}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  ci:
    uses: ./.github/workflows/ci.yml

  # ---- Node native addon (napi-rs) ----
  node-build:
    name: node addon ${{ matrix.target }}
    needs: [verify, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          # Cross compiled from the ARM runner: macos-13 has been retired and
          # the replacement Intel labels are paid larger runners.
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        working-directory: crates/inkling-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm install
      - run: npx napi build --platform --release --target ${{ matrix.target }}
      # index.js and index.d.ts are emitted by the build, next to the binary,
      # and they are the package's entry point. The publish job does not build,
      # so it has to get them from here or the published package has a `main`
      # that points at nothing. They are identical across targets.
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: |
            crates/inkling-node/*.node
            crates/inkling-node/index.js
            crates/inkling-node/index.d.ts

  # musl is built inside Alpine rather than cross compiled from Ubuntu. Setting
  # CC=musl-gcc only redirects the C compiler used for C dependencies; rustc
  # keeps its own linker, so 0.2.1 shipped "musl" binaries that were linked
  # against glibc and died on Alpine with:
  #
  #   Error loading shared library ld-linux-x86-64.so.2
  #
  # Inside the container musl is simply the native target, so there is no cross
  # compilation to get wrong, and the check below proves it rather than assuming.
  node-build-musl:
    name: node addon ${{ matrix.target }}
    needs: [verify, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.host }}
    container: node:20-alpine
    defaults:
      run:
        working-directory: crates/inkling-node
    steps:
      - name: Install a musl-native Rust toolchain
        run: apk add --no-cache git build-base rust cargo
        working-directory: /
      - uses: actions/checkout@v4
      - run: npm install
      # No --target: inside Alpine the host triple is already musl (Alpine calls
      # it x86_64-alpine-linux-musl), so naming x86_64-unknown-linux-musl asks
      # for a std that is not installed. napi reads the platform from Node,
      # which reports musl correctly, and names the output accordingly.
      #
      # A cdylib cannot be statically linked, and musl defaults to crt-static,
      # so it has to be switched off for the addon to be loadable at all.
      - run: npx napi build --platform --release
        env:
          RUSTFLAGS: -C target-feature=-crt-static
      - name: Prove the binary carries no glibc linkage
        run: |
          binary=$(ls *.node)
          echo "checking $binary"
          # A shared object has no program interpreter, so unlike an executable
          # it never names a loader; requiring an ld-musl reference here would
          # fail on a perfectly good build. What actually marked 0.2.1 as a
          # glibc build was the opposite: a DT_NEEDED on the glibc loader and
          # versioned GLIBC_ symbols. A musl build has neither.
          if grep -aq 'ld-linux' "$binary" || grep -aq 'GLIBC_' "$binary"; then
            echo "::error::$binary carries glibc references; it is not a musl build"
            grep -aoE 'ld-linux[^ ]*|GLIBC_[0-9.]+' "$binary" | sort -u | head
            exit 1
          fi
          echo "libc references:"
          grep -aoE 'libc\.[a-z0-9_.-]+|libgcc[a-z0-9_.-]*' "$binary" | sort -u | head || true
          echo "ok: no glibc linkage"
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: |
            crates/inkling-node/*.node
            crates/inkling-node/index.js
            crates/inkling-node/index.d.ts

  node-publish:
    name: assemble and publish node to npm
    needs: [node-build, node-build-musl]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC), once it is configured
      contents: read
    defaults:
      run:
        working-directory: crates/inkling-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Publishing wants a current npm (>= 11.5 for OIDC trusted
          # publishing), and current npm no longer runs on Node 20. The build
          # jobs above stay on 20, which is all napi needs.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          path: crates/inkling-node/artifacts
      # napi ships one npm package per platform, each with its own package.json
      # declaring os/cpu/libc, and the main package depends on all of them
      # optionally. Those directories are generated from the `triples` list
      # rather than committed, so adding a target cannot silently leave the two
      # out of step, which is exactly how 0.2.0 shipped seven optional
      # dependencies that were never published.
      - name: Restore the JS entry point
        run: |
          src=$(find artifacts -name index.js | head -n 1)
          [ -n "$src" ] || { echo "::error::no index.js in any build artifact"; exit 1; }
          cp "$(dirname "$src")/index.js" "$(dirname "$src")/index.d.ts" .
      - run: npx napi create-npm-dir --target .
      # Moves each downloaded binary into npm/<triple>/, which is where
      # prepublish looks for it. Without this step prepublish finds nothing,
      # prints "doesn't exist" for every triple, exits 0 anyway, and publishes a
      # main package whose optionalDependencies all point at packages that were
      # never created. The addon then installs fine and fails at require time.
      - run: npx napi artifacts
      # Assembly runs on a dry run too, so the listing below is the proof that a
      # release will have something to publish. Empty directories here mean a
      # broken release, and this is the only place that is visible before the
      # one-way door.
      - name: Show what will be published
        run: |
          ls -R npm
          missing=0
          for dir in npm/*/; do
            if ! ls "$dir"*.node >/dev/null 2>&1; then
              echo "::error::no binary staged for ${dir}"
              missing=1
            fi
          done
          # The main package carries no binary at all, only the loader that
          # picks one. 0.2.0 shipped without it, and with the whole working
          # directory instead: every platform binary a second time, plus the
          # Rust source. `files` in package.json fixes the second half; this
          # checks both, against the tarball npm would actually upload.
          # Packed for real and read back with tar, rather than parsed out of
          # `npm pack --json`, whose shape differs between npm 11 and 12. This
          # inspects the exact bytes npm would upload and depends on no schema.
          tarball=$(npm pack --silent | tail -n 1)
          contents=$(tar -tzf "$tarball" | sed 's|^package/||' | grep -v '/$')
          rm -f "$tarball"
          echo "$contents"
          for required in index.js index.d.ts; do
            echo "$contents" | grep -qx "$required" || {
              echo "::error::the main package is missing ${required}"
              missing=1
            }
          done
          if echo "$contents" | grep -qE '\.node$|^artifacts/|^src/'; then
            echo "::error::the main package is shipping binaries or sources"
            missing=1
          fi
          exit "$missing"

      - name: Publish the platform packages
        if: env.PUBLISH == 'true'
        run: npx napi prepublish -t npm --skip-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Re-runnable: the platform packages above may need to land for a version
      # whose main package is already on the registry, which is exactly the
      # state a half-finished release leaves behind.
      - name: Publish the main package
        if: env.PUBLISH == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "inkling-loader@${version}" version >/dev/null 2>&1; then
            echo "inkling-loader@${version} is already on the registry, skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Everything above can pass while the published package does not work. It has,
  # for four releases now: the addon shipped with optionalDependencies naming
  # platform packages that were never created, so `npm install` succeeded and
  # `require()` threw. The only check that would have caught it is installing
  # the thing from the registry, on a machine that built none of it, and calling
  # into it. That is this job.
  smoke:
    name: install from npm and run it (${{ matrix.os }})
    needs: node-publish
    # Only after something was actually published. On a dry run there is
    # nothing new on the registry, and these would test the previous
    # release instead. Job-level `if` cannot read the env context, so the
    # PUBLISH condition is spelled out again here.
    if: needs.node-publish.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the published addon and load it
        shell: bash
        run: |
          version=$(curl -fsSL https://registry.npmjs.org/inkling-loader             | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)['dist-tags'].latest))")
          echo "testing inkling-loader@${version}"
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          # The registry needs a moment after a publish before the new platform
          # packages resolve.
          for attempt in 1 2 3 4 5; do
            if npm install "inkling-loader@${version}"; then break; fi
            echo "attempt ${attempt} failed, retrying in 15s"
            sleep 15
          done
          node -e "
            const { Loader } = require('inkling-loader');
            const bar = new Loader({ total: 4, art: '####' });
            bar.inc(2);
            if (bar.position !== 2) { throw new Error('position was ' + bar.position); }
            bar.finishAndClear();
            console.log('native binding loaded and ran');
          "

  # Alpine has no prebuilt-binary fallback either, and musl is the triple most
  # likely to be missing, so it gets checked in a real musl container.
  smoke-musl:
    name: install from npm and run it (alpine)
    needs: node-publish
    # Only after something was actually published. On a dry run there is
    # nothing new on the registry, and these would test the previous
    # release instead. Job-level `if` cannot read the env context, so the
    # PUBLISH condition is spelled out again here.
    if: needs.node-publish.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
    runs-on: ubuntu-latest
    container: node:20-alpine
    steps:
      - name: Install the published addon and load it
        shell: sh
        run: |
          apk add --no-cache curl >/dev/null
          version=$(curl -fsSL https://registry.npmjs.org/inkling-loader             | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s)['dist-tags'].latest))")
          echo "testing inkling-loader@${version} on musl"
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          for attempt in 1 2 3 4 5; do
            if npm install "inkling-loader@${version}"; then break; fi
            echo "attempt ${attempt} failed, retrying in 15s"
            sleep 15
          done
          node -e "
            const { Loader } = require('inkling-loader');
            const bar = new Loader({ total: 4, art: '####' });
            bar.inc(2);
            if (bar.position !== 2) { throw new Error('position was ' + bar.position); }
            bar.finishAndClear();
            console.log('native binding loaded and ran');
          "

  # ---- WebAssembly package (wasm-pack) ----
  wasm-build:
    name: wasm package
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC), once it is configured
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build --target web --release
        working-directory: crates/inkling-wasm
      # The build above runs on a manual dry run too. Everything npm touches is
      # gated on a tag, so a dry run never needs a registry at all.
      - name: Publish to npm
        if: env.PUBLISH == 'true'
        run: |
          npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5
          version=$(node -p "require('./package.json').version")
          if npm view "inkling-wasm@${version}" version >/dev/null 2>&1; then
            echo "inkling-wasm@${version} is already on the registry, skipping"
          else
            npm publish --access public
          fi
        working-directory: crates/inkling-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
