name: npm

# Pushing a version tag publishes the Node addon and the WebAssembly package to
# npm. One-time setup: add an npm automation token as the repo secret NPM_TOKEN
# (npmjs.com -> Access Tokens -> Generate -> Automation).
#
# It can also be run manually from the Actions tab. That builds every platform
# binary and the wasm package but publishes nothing, so a new target can be
# proven before a version number is spent on it: registry versions are
# immutable, and a build that fails after its siblings have shipped leaves the
# packages out of step.
#
# The Node job follows the standard napi-rs flow (one prebuilt binary per
# platform, tied together by optionalDependencies). The WASM job is a single,
# platform-independent package.
#
# Platform coverage matters more here than anywhere else: npm install has no
# source fallback, so a missing triple is a hard install failure for everyone on
# it. Alpine containers and arm64 Linux are both common enough to be table
# stakes, and both were missing before.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm using the version in the manifests (recovery for a half-finished release)"
        type: boolean
        default: false

# A tag publishes. A manual run only builds, unless it is explicitly asked to
# publish, which is the escape hatch for finishing a release that landed the
# main package without its platform packages.
env:
  PUBLISH: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && 'true' || 'false' }}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  ci:
    uses: ./.github/workflows/ci.yml

  # ---- Node native addon (napi-rs) ----
  node-build:
    name: node addon ${{ matrix.target }}
    needs: [verify, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          # musl, built natively on each arch against musl-gcc. Alpine images
          # are where the "no prebuilt binary" reports come from.
          - { host: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { host: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          # Cross compiled from the ARM runner: macos-13 has been retired and
          # the replacement Intel labels are paid larger runners.
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        working-directory: crates/inkling-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
        working-directory: .
      - run: npm install
      - run: npx napi build --platform --release --target ${{ matrix.target }}
        env:
          CC: ${{ matrix.musl && 'musl-gcc' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: crates/inkling-node/*.node

  node-publish:
    name: assemble and publish node to npm
    needs: node-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC), once it is configured
      contents: read
    defaults:
      run:
        working-directory: crates/inkling-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Publishing wants a current npm (>= 11.5 for OIDC trusted
          # publishing), and current npm no longer runs on Node 20. The build
          # jobs above stay on 20, which is all napi needs.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm install
      - uses: actions/download-artifact@v4
        with:
          path: crates/inkling-node/artifacts
      # napi ships one npm package per platform, each with its own package.json
      # declaring os/cpu/libc, and the main package depends on all of them
      # optionally. Those directories are generated from the `triples` list
      # rather than committed, so adding a target cannot silently leave the two
      # out of step, which is exactly how 0.2.0 shipped seven optional
      # dependencies that were never published.
      - run: npx napi create-npm-dir --target .
      # Moves each downloaded binary into npm/<triple>/, which is where
      # prepublish looks for it. Without this step prepublish finds nothing,
      # prints "doesn't exist" for every triple, exits 0 anyway, and publishes a
      # main package whose optionalDependencies all point at packages that were
      # never created. The addon then installs fine and fails at require time.
      - run: npx napi artifacts
      # Assembly runs on a dry run too, so the listing below is the proof that a
      # release will have something to publish. Empty directories here mean a
      # broken release, and this is the only place that is visible before the
      # one-way door.
      - name: Show what will be published
        run: |
          ls -R npm
          missing=0
          for dir in npm/*/; do
            if ! ls "$dir"*.node >/dev/null 2>&1; then
              echo "::error::no binary staged for ${dir}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Publish the platform packages
        if: env.PUBLISH == 'true'
        run: npx napi prepublish -t npm --skip-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Re-runnable: the platform packages above may need to land for a version
      # whose main package is already on the registry, which is exactly the
      # state a half-finished release leaves behind.
      - name: Publish the main package
        if: env.PUBLISH == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "inkling-loader@${version}" version >/dev/null 2>&1; then
            echo "inkling-loader@${version} is already on the registry, skipping"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ---- WebAssembly package (wasm-pack) ----
  wasm-build:
    name: wasm package
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC), once it is configured
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack build --target web --release
        working-directory: crates/inkling-wasm
      # The build above runs on a manual dry run too. Everything npm touches is
      # gated on a tag, so a dry run never needs a registry at all.
      - name: Publish to npm
        if: env.PUBLISH == 'true'
        run: |
          npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5
          version=$(node -p "require('./package.json').version")
          if npm view "inkling-wasm@${version}" version >/dev/null 2>&1; then
            echo "inkling-wasm@${version} is already on the registry, skipping"
          else
            npm publish --access public
          fi
        working-directory: crates/inkling-wasm/pkg
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
