name: Verify release

# Reusable pre-flight for every publishing workflow. A tag push fans out to
# crates.io, PyPI and npm in parallel; each of them calls this first so a
# mistyped tag or a half-bumped set of manifests fails before anything is
# uploaded to a registry, where it cannot be taken back.

on:
  workflow_call:

jobs:
  versions:
    name: manifests agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # On a tag, the tag has to match the manifests too. On a manual dry run
      # there is no tag to compare against, so check only that the manifests
      # agree with each other.
      - name: Check versions
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            scripts/check-versions.sh "${GITHUB_REF_NAME}"
          else
            scripts/check-versions.sh
          fi
