name: Wheels

# Pushing a version tag builds Python wheels (abi3, one per platform) and an
# sdist, then publishes them to PyPI using Trusted Publishing (OIDC), no token.
#
# One-time setup on pypi.org (works before the first release via a "pending
# publisher"): project "inkling-loader" -- the distribution name in
# pyproject.toml, not the "inkling" import name -- then Publishing, and add a
# GitHub publisher with this repository, workflow "wheels.yml", environment
# "pypi".

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: wheel ${{ matrix.id }}
    needs: [verify, ci]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc Linux on both architectures. Graviton and arm64 Docker are
          # ordinary deployment targets now, and a missing wheel there means pip
          # falls back to building from source with no Rust toolchain present.
          - { id: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { id: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: auto }
          # Alpine, same reasoning.
          - { id: musl-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { id: musl-aarch64, os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          # macos-latest is an ARM64 runner, so Intel Macs get no wheel at all
          # unless an older image is named explicitly.
          - { id: macos-x86_64, os: macos-13, target: x86_64 }
          - { id: macos-aarch64, os: macos-latest, target: aarch64 }
          - { id: windows-x64, os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path crates/inkling-py/Cargo.toml
          sccache: true
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.id }}
          path: dist

  sdist:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/inkling-py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: publish to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
