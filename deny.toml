# cargo-deny configuration. CI runs `cargo deny check advisories bans licenses sources`
# so a vulnerable, unvendorable or incompatibly licensed dependency fails the build
# rather than shipping. The tree is deliberately tiny; keep it that way.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive only. Anything copyleft in the tree of a crate published under MIT
# is a problem worth stopping for.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
